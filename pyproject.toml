[project]
name = "transparencia-brasil"
version = "0.1.0"
description = "Plataforma de Transparência e Rastreabilidade de Gastos Públicos Brasileiros"
authors = [{ name = "Plataforma Transparência Brasil" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "polars>=0.20.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "clickhouse-connect>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["packages/pipeline/tests"]
