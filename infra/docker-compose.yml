services:
  # Banco de Dados Analítico Colunar para Consultas em Tempo Real
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: transparencia_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123" # HTTP Interface
      - "9000:9000" # Native Client
    environment:
      CLICKHOUSE_DB: transparencia_brasil
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Banco de Dados Transacional e de Metadados
  postgres:
    image: postgres:16-alpine
    container_name: transparencia_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: transparencia_metadata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Armazenamento de Objetos Compatível com S3 (Camada Bronze/Silver)
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: transparencia_minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Cache de Consultas e Mensageria
  redis:
    image: redis:7.2-alpine
    container_name: transparencia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # API FastAPI
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: transparencia_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
      - clickhouse
      - redis

volumes:
  clickhouse_data:
  postgres_data:
  minio_data:
  redis_data:
